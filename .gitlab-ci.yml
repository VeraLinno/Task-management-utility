stages:
  - validate
  - quality
  - build
  - docker
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  NODE_ENV: "test"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

validate:compose:
  stage: validate
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose -f docker-compose.vps.yml config -q

quality:typecheck:
  stage: quality
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run typecheck

quality:test:
  stage: quality
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run test:ci

build:frontend:
  stage: build
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/

docker:build-images:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f Dockerfile.ts -t task-manager-ts:ci .
    - docker build -f Dockerfile.js -t task-manager-js:ci .
    - docker image ls --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

deploy:vps:
  stage: deploy
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - |
      if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
        echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        touch ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >
      ssh -i ~/.ssh/id_ed25519
      -o StrictHostKeyChecking=${DEPLOY_STRICT_HOST_KEY_CHECKING:-yes}
      ${DEPLOY_USER}@${DEPLOY_HOST}
      "cd ${DEPLOY_PATH}
      ; git fetch --all --prune
      ; git checkout ${DEPLOY_BRANCH:-main}
      ; git pull --ff-only origin ${DEPLOY_BRANCH:-main}
      ; cd velinn-js
      ; docker compose -f docker-compose.vps.yml up -d --build --remove-orphans"
stages:
  - validate
  - quality
  - build
  - docker
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  tags:
    - shared

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  NODE_ENV: "test"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

.nodejs_bootstrap:
  before_script:
    - |
      if ! command -v npm >/dev/null 2>&1; then
        NODE_VERSION="${NODE_VERSION:-20.11.1}"
        NODE_ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.gz"
        NODE_CACHE_DIR="${CI_PROJECT_DIR}/.ci/node"
        NODE_CACHE_ARCHIVE="${CI_PROJECT_DIR}/.ci/${NODE_ARCHIVE}"
        NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}"

        mkdir -p "${CI_PROJECT_DIR}/.ci" "${NODE_CACHE_DIR}"

        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "${NODE_URL}" -o "${NODE_CACHE_ARCHIVE}"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO "${NODE_CACHE_ARCHIVE}" "${NODE_URL}"
        else
          echo "Neither curl nor wget is available to install Node.js" >&2
          exit 1
        fi

        tar -xzf "${NODE_CACHE_ARCHIVE}" -C "${NODE_CACHE_DIR}" --strip-components=1
      fi

      export PATH="${CI_PROJECT_DIR}/.ci/node/bin:${PATH}"
      node --version
      npm --version
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .ci/node/
    policy: pull-push

validate:compose:
  stage: validate
  image: docker/compose:2.29.7
  script:
    - |
      if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
        docker compose -f docker-compose.vps.yml config -q
      elif command -v docker-compose >/dev/null 2>&1; then
        docker-compose -f docker-compose.vps.yml config -q
      else
        echo "Docker Compose is not available in the validate image" >&2
        exit 1
      fi

quality:typecheck:
  stage: quality
  image: node:20-alpine
  extends: .nodejs_bootstrap
  script:
    - npm ci
    - npm run typecheck:ci

quality:test:
  stage: quality
  image: node:20-alpine
  extends: .nodejs_bootstrap
  script:
    - npm ci
    - npm run test:ci

build:frontend:
  stage: build
  image: node:20-alpine
  extends: .nodejs_bootstrap
  script:
    - npm ci
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/

docker:build-images:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f Dockerfile.ts -t task-manager-ts:ci .
    - docker build -f Dockerfile.js -t task-manager-js:ci .
    - docker image ls --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

deploy:vps:
  stage: deploy
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - |
      if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
        echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        touch ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >
      ssh -i ~/.ssh/id_ed25519
      -o StrictHostKeyChecking=${DEPLOY_STRICT_HOST_KEY_CHECKING:-yes}
      ${DEPLOY_USER}@${DEPLOY_HOST}
      "cd ${DEPLOY_PATH}
      ; git fetch --all --prune
      ; git checkout ${DEPLOY_BRANCH:-main}
      ; git pull --ff-only origin ${DEPLOY_BRANCH:-main}
      ; cd velinn-js
      ; docker compose -f docker-compose.vps.yml up -d --build --remove-orphans"
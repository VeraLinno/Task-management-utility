# Docker resolver for container DNS
resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

# Catch-all default server for debugging
server {
  listen 80 default_server;
  server_name _;
  
  # Log requests to troubleshoot
  access_log /var/log/nginx/access.log combined;
  error_log /var/log/nginx/error.log debug;

  location ~ ^/a4(.*)$ {
    # Match requests containing /a4
    proxy_pass http://assignments-frontend-a4-1:80$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location ~ ^/a5(.*)$ {
    # Match requests containing /a5
    proxy_pass http://assignments-frontend-a5-1:80$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = / {
    return 302 /a4/;
  }

  location / {
    return 404 'Route not found. Use /a4/ or /a5/';
    add_header Content-Type text/plain;
  }
}

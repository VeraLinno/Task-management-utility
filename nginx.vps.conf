# Docker resolver for container DNS
resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

# Catch-all default server for debugging
server {
  listen 80 default_server;
  server_name _;
  
  # Log requests to troubleshoot
  access_log /var/log/nginx/access.log combined;
  error_log /var/log/nginx/error.log debug;

  location ~ ^/ts(.*)$ {
    proxy_pass http://task-manager-ts:91$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location ~ ^/js(.*)$ {
    proxy_pass http://task-manager-js:92$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = / {
    return 302 /ts/;
  }

  location / {
    return 404 'Route not found. Use /ts/ or /js/';
    add_header Content-Type text/plain;
  }
}

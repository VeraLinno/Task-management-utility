# Docker resolver for container DNS
resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

# Catch-all default server for debugging
server {
  listen 80 default_server;
  server_name _;

  # Force canonical HTTPS domain when users hit the backend by raw IP.
  if ($host = 192.168.181.101) {
    return 308 https://vera-linno-task-management.proxy.itcollege.ee$request_uri;
  }
  
  # Log requests to troubleshoot
  access_log /var/log/nginx/access.log combined;
  error_log /var/log/nginx/error.log debug;

  location ~ ^/ts(.*)$ {
    proxy_pass http://task-manager-ts$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location ~ ^/js(.*)$ {
    proxy_pass http://task-manager-js$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = / {
    return 302 /ts/;
  }

  location / {
    return 404 'Route not found. Use /ts/ or /js/';
    add_header Content-Type text/plain;
  }
}
